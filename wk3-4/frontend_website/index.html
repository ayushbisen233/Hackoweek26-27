<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Analytics Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1 id="main-title">Data Analytics Dashboard</h1>
        <p>A simple frontend to view our dataset analysis.</p>
        <div class="dataset-selector">
            <button id="ds1-btn" class="btn active-ds">Dataset 1 (Housing)</button>
            <button id="ds2-btn" class="btn">Dataset 2 (Netflix)</button>
        </div>
    </header>

    <main class="container">
        <!-- Top 10 Entries -->
        <section class="section" id="dataset-section">
            <div class="section-header">
                <h2>Top 10 Dataset Entries</h2>
                <button id="refresh-data-btn" class="btn">Refresh Data</button>
            </div>
            <div class="table-container">
                <table id="data-table">
                    <thead id="table-head">
                        <!-- Headers populated by script.js dynamically -->
                    </thead>
                    <tbody id="table-body">
                        <!-- Data populated by script.js -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Operations Performed -->
        <section class="section" id="operations-section">
            <div class="section-header">
                <h2>Operations Performed</h2>
                <button id="view-ops-btn" class="btn">View Operations</button>
            </div>
            <div id="operations-list" class="hidden">
                <ul id="ops-ul">
                    <!-- Operations populated by script.js -->
                </ul>
            </div>
        </section>

        <!-- Visualizations -->
        <section class="section" id="visualizations-section">
            <div class="section-header">
                <h2>Generated Visualizations</h2>
                <button id="view-charts-btn" class="btn">Load Charts</button>
            </div>
            
            <div id="charts-grid" class="hidden charts-grid">
                <div class="chart-card">
                    <h3 id="chart1-title">Chart 1</h3>
                    <img id="chart1-img" src="" alt="Chart 1">
                </div>
                <div class="chart-card">
                    <h3 id="chart2-title">Chart 2</h3>
                    <img id="chart2-img" src="" alt="Chart 2">
                </div>
                <div class="chart-card">
                    <h3 id="chart3-title">Chart 3</h3>
                    <img id="chart3-img" src="" alt="Chart 3">
                </div>
                <div class="chart-card">
                    <h3 id="chart4-title">Chart 4</h3>
                    <img id="chart4-img" src="" alt="Chart 4">
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Analytics Engine - Multi Dataset Platform</p>
    </footer>

    <!-- Load the data generated by the python backend -->
    <script src="data.js"></script>
    <!-- Load the interactive logic -->
    <script src="script.js"></script>
</body>
</html>
